          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark"
              android:fillViewport="true">

              <LinearLayout
                  android:orientation="vertical"
                  android:padding="20dp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <LinearLayout
                      android:orientation="vertical"
                      android:background="@drawable/bg_header"
                      android:padding="22dp"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Gucci Panel"
                          android:textColor="#FFFFFF"
                          android:textSize="26sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.02"/>

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Quick controls for your device"
                          android:textColor="#CCFFFFFF"
                          android:textSize="13sp"
                          android:layout_marginTop="4dp"/>
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="CONTROLS"
                      android:textColor="@color/text_secondary"
                      android:textSize="11sp"
                      android:letterSpacing="0.15"
                      android:layout_marginTop="24dp"
                      android:layout_marginBottom="10dp"
                      android:layout_marginStart="6dp"/>

                  <Button
                      android:id="@+id/testSafeBtn"
                      android:layout_width="match_parent"
                      android:layout_height="64dp"
                      android:text="Gucci Normal"
                      android:textColor="#00140A"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.03"
                      android:background="@drawable/bg_btn_normal"
                      android:stateListAnimator="@null"
                      android:elevation="6dp"/>

                  <Button
                      android:id="@+id/testBrutalBtn"
                      android:layout_width="match_parent"
                      android:layout_height="64dp"
                      android:text="Gucci Brutal"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.03"
                      android:background="@drawable/bg_btn_brutal"
                      android:stateListAnimator="@null"
                      android:elevation="6dp"
                      android:layout_marginTop="14dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                   
