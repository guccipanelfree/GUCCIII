name: Settings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Verify Gradle
        run: gradle --version

      - name: Scaffold project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Settings"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.shtile'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Settings"
                  android:theme="@style/Theme.Settings">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".RunnerReceiver"
                      android:exported="false"/>

                  <service
                      android:name=".SafeTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_normal"
                      android:label="Gucci Normal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

                  <service
                      android:name=".BrutalTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_brutal"
                      android:label="Gucci Brutal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/Runner.kt <<'EOF'
          package com.example.shtile

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast

          object Runner {

              fun runNormal(context: Context, onDone: ((Int) -> Unit)? = null) {
                  Thread {
                      val code = try {
                          val cmd = "cd /data/local/tmp && ./.ixl"
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          p.inputStream.close()
                          p.waitFor()
                      } catch (e: Exception) {
                          -1
                      }
                      Handler(Looper.getMainLooper()).post {
                          Toast.makeText(
                              context,
                              if (code == 0) "Normal Done" else "Normal Exit $code",
                              Toast.LENGTH_SHORT
                          ).show()
                          onDone?.invoke(code)
                      }
                  }.start()
              }

              fun runBrutal(context: Context, onDone: ((Int) -> Unit)? = null) {
                  Thread {
                      val code = try {
                          val cmd = "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal >/dev/null 2>&1"
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          p.inputStream.close()
                          p.waitFor()
                      } catch (e: Exception) {
                          -1
                      }
                      Handler(Looper.getMainLooper()).post {
                          Toast.makeText(
                              context,
                              if (code == 0) "Brutal Done" else "Brutal Exit $code",
                              Toast.LENGTH_SHORT
                          ).show()
                          onDone?.invoke(code)
                      }
                  }.start()
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/RunnerReceiver.kt <<'EOF'
          package com.example.shtile

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class RunnerReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      "com.example.shtile.RUN_NORMAL" -> Runner.runNormal(context)
                      "com.example.shtile.RUN_BRUTAL" -> Runner.runBrutal(context)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class SafeTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Gucci Normal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  val i = Intent(this, RunnerReceiver::class.java).apply {
                      action = "com.example.shtile.RUN_NORMAL"
                  }
                  sendBroadcast(i)

                  Handler(Looper.getMainLooper()).postDelayed({
                      qsTile?.state = Tile.STATE_INACTIVE
                      qsTile?.updateTile()
                  }, 1500)
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class BrutalTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Gucci Brutal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()
                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  val i = Intent(this, RunnerReceiver::class.java).apply {
                      action = "com.example.shtile.RUN_BRUTAL"
                  }
                  sendBroadcast(i)

                  Handler(Looper.getMainLooper()).postDelayed({
                      qsTile?.state = Tile.STATE_INACTIVE
                      qsTile?.updateTile()
                  }, 1500)
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile

          import android.animation.ObjectAnimator
          import android.os.Bundle
          import android.view.View
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  status = findViewById(R.id.status)

                  findViewById<Button>(R.id.testSafeBtn).setOnClickListener {
                      pulse(it)
                      status.text = "Running Gucci Normal..."
                      Runner.runNormal(this) { code ->
                          status.text = "Gucci Normal Result:\nexit=$code"
                      }
                  }

                  findViewById<Button>(R.id.testBrutalBtn).setOnClickListener {
                      pulse(it)
                      status.text = "Running Gucci Brutal..."
                      Runner.runBrutal(this) { code ->
                          status.text = "Gucci Brutal Result:\nexit=$code"
                      }
                  }

                  status.text = "Ready to test."
              }

              private fun pulse(v: View) {
                  val a = ObjectAnimator.ofFloat(v, "scaleX", 1f, 0.96f, 1f)
                  a.duration = 220
                  a.interpolator = AccelerateDecelerateInterpolator()
                  a.start()
                  val b = ObjectAnimator.ofFloat(v, "scaleY", 1f, 0.96f, 1f)
                  b.duration = 220
                  b.interpolator = AccelerateDecelerateInterpolator()
                  b.start()
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
